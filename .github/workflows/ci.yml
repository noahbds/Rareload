name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: glualint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download glualint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo FPtje/GLuaFixer --pattern '*x86_64-linux.zip' --dir glualint-dl
          cd glualint-dl
          unzip -q -o ./*.zip
          chmod +x "$(find . -type f -name glualint | head -n 1)"
          echo "$PWD/$(dirname "$(find . -type f -name glualint | head -n 1)")" >> "$GITHUB_PATH"
      - run: glualint lint lua

  checks:
    name: Syntax, translations and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Every Lua file compiles
        run: |
          status=0
          while IFS= read -r f; do
            luajit -bl "$f" > /dev/null || status=1
          done < <(find lua -name '*.lua')
          exit $status
      - name: Every language has the English keys
        run: luajit .github/scripts/check_lang.lua
      # The unit tests and architecture rules are kept out of the repository; they run when present.
      - name: Unit tests
        if: hashFiles('tests/run.lua') != ''
        run: luajit tests/run.lua
      - name: Architecture rules
        if: hashFiles('tools/check_rules.sh') != ''
        run: bash tools/check_rules.sh
