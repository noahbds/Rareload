name: CI

on:
  push:
  pull_request:

jobs:
  rules:
    name: Architecture & platform rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/check_rules.sh

  lint:
    name: glualint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download glualint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo FPtje/GLuaFixer --pattern '*linux*' --dir glualint-dl
          cd glualint-dl
          for a in *; do case "$a" in *.zip) unzip -q "$a" ;; *.tar.gz) tar xzf "$a" ;; esac; done
          chmod +x "$(find . -type f -name glualint | head -n 1)"
          echo "$PWD/$(dirname "$(find . -type f -name glualint | head -n 1)")" >> "$GITHUB_PATH"
      - run: glualint lint lua

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Run tests
        run: |
          if [ -f tests/run.lua ]; then
            luajit tests/run.lua
          else
            echo "No tests yet (added in Phase 1)."
          fi
